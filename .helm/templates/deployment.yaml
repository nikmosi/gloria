apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gloria.fullname" . }}
  labels:
    {{- include "gloria.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "gloria.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- if or (not .Values.collector.existingSecret) .Values.podAnnotations }}
      annotations:
        {{- if not .Values.collector.existingSecret }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      labels:
        {{- include "gloria.selectorLabels" . | nindent 8 }}
    spec:
      enableServiceLinks: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "gloria.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: collector
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.collector.port }}
              protocol: TCP
          envFrom:
            - prefix: GLORIA_
              secretRef:
                name: {{ .Values.collector.existingSecret | default (include "gloria.fullname" .) }}
          env:
            - name: GLORIA_PORT
              value: {{ .Values.collector.port | quote }}
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: TERM
              value: "xterm"
          {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: storage
              mountPath: /app/var/collector
      volumes:
        - name: storage
        {{- if .Values.collector.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.collector.persistence.existingClaim | default (printf "%s-data" (include "gloria.fullname" .)) }}
        {{- else }}
          emptyDir: {}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
