{{- if not .Values.collector.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gloria-stalker.fullname" . }}
  labels:
    {{- include "gloria-stalker.labels" . | nindent 4 }}
type: Opaque
stringData:
  client_id: {{ .Values.collector.twitch.clientId | quote }}
  client_secret: {{ .Values.collector.twitch.clientSecret | quote }}
  {{- if .Values.collector.callbackUrl }}
  callback_url: {{ .Values.collector.callbackUrl | quote }}
  {{- end }}
  database: "postgresql+asyncpg://{{ .Values.postgresql.auth.username }}:{{ .Values.postgresql.auth.password }}@{{ include "gloria-stalker.fullname" . }}-postgres:5432/{{ .Values.postgresql.auth.database }}"
{{- end }}
