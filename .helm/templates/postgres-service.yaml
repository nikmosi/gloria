{{- if .Values.postgresql.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gloria-stalker.fullname" . }}-postgres
  labels:
    {{- include "gloria-stalker.postgresLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: postgresql
      protocol: TCP
      name: postgresql
  selector:
    {{- include "gloria-stalker.postgresSelectorLabels" . | nindent 4 }}
{{- end }}
