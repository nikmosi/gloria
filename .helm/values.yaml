replicaCount: 1

image:
  repository: gloria-collector
  pullPolicy: IfNotPresent
  tag: "local"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automountServiceAccountToken: false
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

service:
  enabled: true
  type: ClusterIP
  port: 8000
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: gloria.local
      paths:
        - path: /login/confirm
          pathType: Prefix
        - path: /login
          pathType: Prefix
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local


collector:
  existingSecret: ""
  port: 8000
  targetChannels: "nikmosi"
  callbackUrl: "http://localhost/login/confirm"
  logLevel: "INFO"
  storagePath: "/app/var/collector/token.json"
  database: "postgresql+asyncpg://user:123@postgres:5432/collector"
  twitch:
    clientId: "dummy-client-id"
    clientSecret: "dummy-client-secret"
  persistence:
    enabled: true
    accessModes:
      - ReadWriteOnce
    size: 1Gi
    storageClass: ""
    existingClaim: ""

migration:
  enabled: true
  backoffLimit: 2
  activeDeadlineSeconds: 300
  annotations: {}
  resources:
    limits:
      cpu: 300m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

extraEnv: []


nodeSelector: {}

tolerations: []

affinity: {}
