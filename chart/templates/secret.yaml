apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gloria-stalker.fullname" . }}
  labels:
    {{- include "gloria-stalker.labels" . | nindent 4 }}
type: Opaque
stringData:
  clientId: {{ .Values.collector.twitch.clientId | quote }}
  clientSecret: {{ .Values.collector.twitch.clientSecret | quote }}
  postgresPassword: {{ .Values.postgresql.auth.password | quote }}
